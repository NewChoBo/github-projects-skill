name: Bootstrap v0.1.0 Release

on:
  push:
    branches:
      - 'agent/release-bootstrap-v0.1.0'
    paths:
      - '.github/workflows/bootstrap-v0.1.0.yml'

permissions:
  contents: write

jobs:
  bootstrap-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current main
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Check GitHub CLI Agent Skills support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          if ! gh skill --help >/dev/null 2>&1; then
            echo '::error::This runner does not provide a GitHub CLI version with gh skill support (GitHub CLI 2.90.0+ required).'
            exit 1
          fi

      - name: Validate tagged skill candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout "$MAIN_SHA"
          gh skill publish --dry-run

      - name: Create v0.1.0 tag at current main
        env:
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$MAIN_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Verify tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$MAIN_SHA"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,url,targetCommitish
