name: Verify v0.1.0 Install

on:
  push:
    branches:
      - 'agent/release-bootstrap-v0.1.0'
    paths:
      - '.github/workflows/install-verify-v0.1.0.yml'

permissions:
  contents: write

jobs:
  verify-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Check GitHub CLI Agent Skills support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh skill --help >/dev/null

      - name: Preview published skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill preview NewChoBo/github-projects-skill github-projects@v0.1.0

      - name: Install for Codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh skill install NewChoBo/github-projects-skill github-projects@v0.1.0 --agent codex --scope user --force
          gh skill list --agent codex

      - name: Install for Claude Code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh skill install NewChoBo/github-projects-skill github-projects@v0.1.0 --agent claude-code --scope user --force
          gh skill list --agent claude-code

      - name: Record install verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/release-verification
          cat > .github/release-verification/v0.1.0-install.txt <<EOF
          release=v0.1.0
          repository=NewChoBo/github-projects-skill
          verified_by=github-actions
          verification=preview+codex-install+claude-code-install
          EOF
          git add .github/release-verification/v0.1.0-install.txt
          git commit -m 'test: verify v0.1.0 skill installation'
          git push origin HEAD:agent/release-bootstrap-v0.1.0
