name: Release Skill

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be SemVer and start with v (for example v0.1.0 or v0.2.0-rc.1)."
            exit 1
          fi

          git fetch origin main --tags --force

          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "::error::Checked out commit does not match tag $RELEASE_TAG."
            exit 1
          fi

          if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
            echo "::error::Release tag must point to the current main commit."
            echo "tag=$TAG_COMMIT"
            echo "main=$MAIN_COMMIT"
            exit 1
          fi

      - name: Check GitHub CLI Agent Skills support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          if ! gh skill --help >/dev/null 2>&1; then
            echo '::error::This runner does not provide a GitHub CLI version with gh skill support (GitHub CLI 2.90.0+ required).'
            exit 1
          fi

      - name: Validate Agent Skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Determine release type
        id: release_type
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release_type.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          args=(
            "$RELEASE_TAG"
            --verify-tag
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --json tagName,isDraft,isPrerelease,url,targetCommitish \
            --jq '{tagName,isDraft,isPrerelease,url,targetCommitish}'
